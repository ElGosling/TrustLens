# TrustLens source registry. Add or remove sources here; do not edit search code.
# `tier` and `notes` document curation decisions only in this milestone. They do
# not change the GPT prompt, verdict, confidence, or search ranking.

version = 1

[[sources]]
id = "singapore-government"
name = "Singapore Government"
domain = "gov.sg"
include_subdomains = true
category = "government"
tier = 1
notes = "Umbrella for official Singapore Government agencies and statutory boards, including moh.gov.sg, mha.gov.sg, mas.gov.sg, police.gov.sg, nea.gov.sg, sfa.gov.sg, singstat.gov.sg, parliament.gov.sg, eld.gov.sg, and data.gov.sg. All gov.sg paths are enabled."

